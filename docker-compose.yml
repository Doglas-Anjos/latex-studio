services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy noeviction --save ""
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repos_data:/data/repos
      - builds_data:/data/builds
    mem_limit: 512m
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - public
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/texlive/Dockerfile
    # Only what the worker needs: no session secret, no admin password (TeX runs as the same uid).
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REPOS_DIR: /data/repos
      BUILDS_DIR: /data/builds
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-180000}
      COMPILE_MEMORY_MB: ${COMPILE_MEMORY_MB:-1024}
    # Reaps TeX processes orphaned by a timeout kill.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repos_data:/data/repos
      - builds_data:/data/builds
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - api
    networks:
      - public
    restart: unless-stopped

volumes:
  postgres_data:
  repos_data:
  builds_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:
