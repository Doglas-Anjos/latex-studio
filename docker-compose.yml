# Fixed project name, so volumes are latex-studio_* whatever the folder (scripts/backup.sh uses it).
name: latex-studio

# Cap container log growth: 3 x 10 MB per service, so a chatty or looping service can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy noeviction --save ""
    mem_limit: 96m
    # redis-cli reads the password from here, so the healthcheck never shows it in `ps`.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    # Override .env's NODE_ENV=development: in production the config schema refuses local mode
    # (no AUTH_*), so a stack missing the verifier config fails loudly at startup instead of
    # running open.
    environment:
      NODE_ENV: production
    logging: *default-logging
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repos_data:/data/repos
      - builds_data:/data/builds
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${API_PORT:-3000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - public
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/texlive/Dockerfile
    # Only what the worker needs: no auth secret. WORKER_DATABASE_URL points at the
    # least-privilege latex_worker role (docker/postgres/worker-role.sql); it falls back to the
    # full DATABASE_URL when unset, so nothing breaks before the role is created.
    environment:
      NODE_ENV: production
      DATABASE_URL: ${WORKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      REPOS_DIR: /data/repos
      BUILDS_DIR: /data/builds
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      TOOLS_CONCURRENCY: ${TOOLS_CONCURRENCY:-1}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-180000}
      COMPILE_MEMORY_MB: ${COMPILE_MEMORY_MB:-1024}
      # Default to a hard requirement so the worker refuses to start without the bubblewrap sandbox
      # (bwrap works under this service's cap_drop/no-new-privileges; see sandbox.ts). An operator on
      # a kernel without unprivileged user namespaces can set COMPILE_SANDBOX=auto in .env.
      COMPILE_SANDBOX: ${COMPILE_SANDBOX:-require}
      COMPILE_ALLOW_LUALATEX: ${COMPILE_ALLOW_LUALATEX:-false}
    logging: *default-logging
    # Reaps TeX processes orphaned by a timeout kill.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repos_data:/data/repos
      - builds_data:/data/builds
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_FASORX_URL: ${VITE_FASORX_URL}
        VITE_FASORX_APP: ${VITE_FASORX_APP:-latex}
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      VITE_FASORX_URL: ${VITE_FASORX_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped

volumes:
  postgres_data:
  repos_data:
  builds_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:
