version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # TypeScript 7 (the native preview) dropped the programmatic compiler API the Nest CLI needs for
    # `nest start --watch`, so stay on 6 until it returns; a human bumps the major by hand.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      actions:
        patterns: ["*"]

  # Node majors are bumped once, by hand, across all three images.
  - package-ecosystem: docker
    directories: ["/docker/api", "/docker/texlive", "/docker/web"]
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
