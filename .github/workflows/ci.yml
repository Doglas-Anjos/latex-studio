name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans every commit of the push, so it needs the history
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/${{ matrix.image }}/Dockerfile -t latex-studio-${{ matrix.image }} .
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: latex-studio-${{ matrix.image }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned by digest (texlive/texlive:latest as of 2026-10-04); keep in sync with docker/texlive/Dockerfile.
    container: texlive/texlive@sha256:a7ae4dfa9d521b5db14446872fa488b839021d1f604d0a3c74461784895f2a67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The TeX Live image has no Node, and pnpm's installer needs it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm test:latex

  # Publishes main on the FasorX server after every green push (scripts/deploy-fasorx.sh). Off until
  # the repository variable PUBLISH_TARGET is "fasorx", so forks and fresh clones never try.
  # Secrets of the "producao" environment:
  #   VPS_HOST, VPS_PORT, VPS_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS   same as the FasorX repo
  #   POSTGRES_PASSWORD, REDIS_PASSWORD, POSTGRES_WORKER_PASSWORD      letters/digits, e.g. `openssl rand -hex 32`;
  #                                                                    keep them: Postgres sets its password once
  #   SUPER_ADMIN_EMAIL                                                platform admin(s), comma-separated
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_TARGET == 'fasorx'
    needs: [check, images, latex]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: producao
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      APP_HOST: latex.fasorx.com.br
      FASORX: https://fasorx.com.br
    steps:
      # Runs queue one at a time but not in order: a run for an older commit that reaches this
      # job last must not redeploy older code.
      - name: Skip if main moved on
        id: head
        run: |
          latest=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $latest now; its own run publishes it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.stale != 'true'
        with:
          persist-credentials: false

      - name: Prepare SSH
        if: steps.head.outputs.stale != 'true'
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          # An unreadable key and an unauthorized one both end in "Permission denied (publickey)".
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1 ||
            { echo "::error::SSH_PRIVATE_KEY is not a valid private key."; exit 1; }
          ssh-keygen -F "[$VPS_HOST]:$VPS_PORT" -f ~/.ssh/known_hosts > /dev/null 2>&1 ||
            ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /dev/null 2>&1 ||
            { echo "::error::SSH_KNOWN_HOSTS has no entry for this server."; exit 1; }

      - name: Write the server .env
        if: steps.head.outputs.stale != 'true'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_WORKER_PASSWORD: ${{ secrets.POSTGRES_WORKER_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
        run: |
          # Letters and digits only: the passwords go inside connection URLs unescaped.
          for v in POSTGRES_PASSWORD REDIS_PASSWORD POSTGRES_WORKER_PASSWORD; do
            [[ "${!v}" =~ ^[A-Za-z0-9]{24,}$ ]] ||
              { echo "::error::$v must be 24+ letters/digits (openssl rand -hex 32)."; exit 1; }
          done
          [[ "$SUPER_ADMIN_EMAIL" =~ ^[A-Za-z0-9._%+@,-]+$ ]] ||
            { echo "::error::SUPER_ADMIN_EMAIL must be e-mails separated by commas, no spaces."; exit 1; }
          umask 077
          cat > /tmp/latex-studio.env <<EOF
          NODE_ENV=production
          APP_DOMAIN=:80
          APP_URL=https://$APP_HOST
          API_PORT=3000
          POSTGRES_USER=latex
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=latex
          DATABASE_URL=postgres://latex:$POSTGRES_PASSWORD@postgres:5432/latex
          POSTGRES_WORKER_PASSWORD=$POSTGRES_WORKER_PASSWORD
          WORKER_DATABASE_URL=postgres://latex_worker:$POSTGRES_WORKER_PASSWORD@postgres:5432/latex
          REDIS_PASSWORD=$REDIS_PASSWORD
          REDIS_URL=redis://:$REDIS_PASSWORD@redis:6379
          AUTH_JWKS_URL=$FASORX/.well-known/jwks.json
          AUTH_ISSUER=$FASORX
          AUTH_AUDIENCE=latex
          AUTH_MAX_TOKEN_TTL_S=900
          SUPERADMIN_EMAILS=$SUPER_ADMIN_EMAIL
          VITE_FASORX_URL=$FASORX
          VITE_FASORX_APP=latex
          REPOS_DIR=/data/repos
          BUILDS_DIR=/data/builds
          USER_QUOTA_MB=50
          EOF

      - name: Send and publish
        if: steps.head.outputs.stale != 'true'
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          git archive --format=tar.gz -o /tmp/latex-studio.tgz HEAD
          # Only the known_hosts entry is trusted, and nothing ever waits for a prompt.
          opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # The .env goes as a file, never as a remote command argument that `ps` would show.
          scp -P "$PORT" "${opts[@]}" /tmp/latex-studio.tgz /tmp/latex-studio.env \
            scripts/deploy-fasorx.sh "$TARGET:/tmp/"
          shred -u /tmp/latex-studio.env
          ssh -p "$PORT" "${opts[@]}" "$TARGET" bash -s <<'REMOTE'
          set -e
          mkdir -p /srv/latex-studio
          # .env.next: the script makes it the new .env, so a rollback keeps the previous one.
          install -m 600 /tmp/latex-studio.env /srv/latex-studio/.env.next
          shred -u /tmp/latex-studio.env
          trap 'rm -f /tmp/deploy-fasorx.sh' EXIT
          bash /tmp/deploy-fasorx.sh /tmp/latex-studio.tgz
          REMOTE
