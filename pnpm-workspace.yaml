packages:
  - apps/*
  - packages/*

# Dedupe fastify to one copy: @nestjs/platform-fastify pins 5.12.5 while apps/api and the @fastify/*
# plugins want 5.12.7, and two copies give incompatible FastifyInstance types at build.
overrides:
  fastify: 5.12.7

# Supply-chain policy: refuse versions published less than 24h ago
minimumReleaseAge: 1440

# Native build scripts allowed to run on install (reviewed)
allowBuilds:
  esbuild: true
  msgpackr-extract: false

# Accepted advisories (rationale in SECURITY.md). nanoid <3.3.18 DoS: only reachable path is
# hunspell-asm > emscripten-wasm-loader calling nanoid(45) — a fixed, server-side size, so not
# exploitable; nanoid 3.x drops the function-style default export it needs, so there is no safe bump.
auditConfig:
  ignoreGhsas:
    - GHSA-28wg-ghj8-5hjv
    - GHSA-2v37-7h3g-55p8
    - GHSA-xwg4-73v4-xw9w
